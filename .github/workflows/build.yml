name: Build ImmortalWrt Firmware
on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      target:
        description: 'Build target (jdc-1 / arm64-main / all)'
        required: true
        default: 'arm64-main'
        type: choice
        options:
          - jdc-1
          - arm64-main
          - all
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  TZ: Asia/Shanghai

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      targets: ${{ steps.set-matrix.outputs.targets }}
    steps:
      - id: set-matrix
        run: |
          INPUT_TARGET="${{ github.event.inputs.target || 'arm64-main' }}"
          if [ "$INPUT_TARGET" = "all" ]; then
            echo 'targets=["arm64-main","jdc-1"]' >> "$GITHUB_OUTPUT"
          else
            echo "targets=[\"$INPUT_TARGET\"]" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.prepare.outputs.targets) }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"

    - name: Clone source code
      run: |
        if [ "${{ matrix.target }}" = "arm64-main" ]; then
          BRANCH="openwrt-24.10"
        else
          BRANCH="openwrt-23.05"
        fi
        echo "Cloning branch: $BRANCH for ${{ matrix.target }}"
        git clone --depth 1 $REPO_URL -b "$BRANCH" openwrt

    - name: Add custom feeds
      run: |
        if [ "${{ matrix.target }}" = "arm64-main" ]; then
          echo "src-git mihomo https://github.com/morytyann/OpenWrt-mihomo.git;main" >> openwrt/feeds.conf.default
        fi

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        cat ${{ matrix.target }}.seed > openwrt/.config
        if [ -d "files/${{ matrix.target }}" ]; then
          mkdir -p openwrt/files
          cp -r files/${{ matrix.target }}/. openwrt/files/
          if [ -d "openwrt/files/etc/uci-defaults" ]; then
            chmod +x openwrt/files/etc/uci-defaults/*
          fi
        fi
        cd openwrt
        make defconfig
        echo "=== Verify key options in .config ==="
        if [ "${{ matrix.target }}" = "arm64-main" ]; then
          grep -E "CONFIG_TARGET_DEVICE_qualcommax_ipq807x_DEVICE_redmi_ax6|CONFIG_PACKAGE_nikki=|CONFIG_PACKAGE_luci-app-nikki=|CONFIG_PACKAGE_kmod-tcp-bbr=|CONFIG_PACKAGE_wpad-openssl=|CONFIG_PACKAGE_odhcpd" .config || true
          grep -q "CONFIG_TARGET_DEVICE_qualcommax_ipq807x_DEVICE_redmi_ax6-stock=y" .config
          grep -q "CONFIG_PACKAGE_nikki=y" .config
          grep -q "CONFIG_PACKAGE_luci-app-nikki=y" .config
        else
          grep -E "CONFIG_TARGET_ramips_mt7621_DEVICE_jdcloud_re-sp-01b|CONFIG_PACKAGE_kmod-nf-flow|CONFIG_PACKAGE_kmod-nft-offload|CONFIG_PACKAGE_kmod-nft-fullcone|CONFIG_PACKAGE_kmod-tcp-bbr|CONFIG_PACKAGE_wpad-openssl|CONFIG_PACKAGE_dawn|CONFIG_PACKAGE_umdns|CONFIG_PACKAGE_odhcpd|CONFIG_PACKAGE_odhcp6c|CONFIG_PACKAGE_luci-app-upnp|CONFIG_PACKAGE_automount|CONFIG_PACKAGE_kmod-fs-ext4|CONFIG_PACKAGE_kmod-tun|CONFIG_PACKAGE_tailscale" .config || true
          grep -q "CONFIG_TARGET_ramips_mt7621_DEVICE_jdcloud_re-sp-01b=y" .config
          grep -q "CONFIG_PACKAGE_kmod-fs-ext4=y" .config
          grep -q "CONFIG_PACKAGE_kmod-tun=y" .config
          grep -q "CONFIG_PACKAGE_tailscale=y" .config
        fi

    - name: SSH connection to Actions
      uses: P3TERX/ssh2actions@v1.0.0
      if: (github.event.inputs.ssh == 'true' && github.event.inputs.ssh  != 'false') || contains(github.event.action, 'ssh')

    - name: Download package
      id: package
      run: |
        cd openwrt
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s

    - name: Upload firmware directory
      uses: actions/upload-artifact@v4
      with:
        name: ImmortalWrt_${{ matrix.target }}
        path: openwrt/bin/targets/*/*/*.*
